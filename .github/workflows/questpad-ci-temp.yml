name: Temporary QuestPad 0.7.7 CI

on:
  push:
    branches: [questpad-ci-temp]
  workflow_dispatch:

jobs:
  build-questpad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore, patch, test, and build QuestPad
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/questpad-ci.log) 2>&1
          EXIT_CODE=0

          echo "=== Runner ==="
          uname -a
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "=== Restore source ==="
          base64 -d questpad-ci/questpad-source.b64 > /tmp/QuestPad-v0.7.7-fixed-source.zip
          RC=$?
          if [ $RC -ne 0 ]; then EXIT_CODE=$RC; fi
          sha256sum /tmp/QuestPad-v0.7.7-fixed-source.zip
          echo "8269e1cfbacc33b0f237b7b3659c72b006b74b40a7a97ad8b3fbb0c10734ca9a  /tmp/QuestPad-v0.7.7-fixed-source.zip" | sha256sum -c -
          RC=$?
          if [ $RC -ne 0 ] && [ $EXIT_CODE -eq 0 ]; then EXIT_CODE=$RC; fi
          mkdir -p /tmp/questpad-src
          unzip -q -o /tmp/QuestPad-v0.7.7-fixed-source.zip -d /tmp/questpad-src
          RC=$?
          if [ $RC -ne 0 ] && [ $EXIT_CODE -eq 0 ]; then EXIT_CODE=$RC; fi

          if [ $EXIT_CODE -eq 0 ]; then
            echo "=== Apply verified Spatial SDK 0.13.2 cursor API correction ==="
            python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/questpad-src/app/src/main/java/com/dearformerself/questinputlab/QuestInputLabActivity.kt")
          s = p.read_text()
          old = "systemManager.findSystem<IsdkDefaultCursorSystem>().active = !controllerRoutingEnabled"
          new = "systemManager.findSystem<IsdkDefaultCursorSystem>().enableInput(!controllerRoutingEnabled)"
          if old not in s:
              raise SystemExit("Expected cursor suppression line not found")
          p.write_text(s.replace(old, new))
          PY
          fi

          if [ $EXIT_CODE -eq 0 ]; then
            echo "=== Android SDK ==="
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 | head -1)"
            fi
            echo "SDKMANAGER=$SDKMANAGER"
            if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
              "$SDKMANAGER" "platforms;android-34" "build-tools;35.0.0"
              RC=$?
              if [ $RC -ne 0 ]; then EXIT_CODE=$RC; fi
            else
              echo "sdkmanager not found; checking whether API 34 is already installed."
              if [ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
                EXIT_CODE=127
              fi
            fi
          fi

          if [ $EXIT_CODE -eq 0 ]; then
            echo "=== Unit tests + APK ==="
            cd /tmp/questpad-src
            chmod +x gradlew
            ./gradlew testDebugUnitTest assembleDebug --stacktrace
            RC=$?
            if [ $RC -ne 0 ]; then EXIT_CODE=$RC; fi
          fi

          echo "=== APK verification ==="
          APK="/tmp/questpad-src/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            unzip -l "$APK" | tee /tmp/apk-list.txt
            if grep -q "libquestpad_engine.so" /tmp/apk-list.txt; then
              echo "ERROR: external controller engine packaged"
              [ $EXIT_CODE -eq 0 ] && EXIT_CODE=80
            fi
            if grep -q "questpad_vrshell_lease.dex" /tmp/apk-list.txt; then
              echo "ERROR: old VrShell lease packaged"
              [ $EXIT_CODE -eq 0 ] && EXIT_CODE=81
            fi
            sha256sum "$APK" | tee /tmp/apk.sha256
          else
            echo "No APK produced."
          fi

          echo "$EXIT_CODE" > /tmp/build.exit
          echo "BUILD_EXIT=$EXIT_CODE"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuestPad-v0.7.7-DIAGNOSTICS
          path: |
            /tmp/questpad-ci.log
            /tmp/build.exit
            /tmp/apk.sha256
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuestPad-v0.7.7-FIXED
          path: /tmp/questpad-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Report result
        if: always()
        shell: bash
        run: exit "$(cat /tmp/build.exit 2>/dev/null || echo 99)"
