name: QuestPad RC7 unsigned build

on:
  push:
    branches: [questpad-ci-rc3]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact RC7 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/questpad-src
          mkdir -p /tmp/questpad-src
          cp questpad-ci/QuestPad-v0.8.0-RC7-SOURCE.zip /tmp/QuestPad-v0.8.0-RC7-SOURCE.zip
          echo "0e8d00aaf30a812366e04517f85b096cbcfa7b8eb196e0474ada5d19df4bea74  /tmp/QuestPad-v0.8.0-RC7-SOURCE.zip" | sha256sum -c -
          unzip -q /tmp/QuestPad-v0.8.0-RC7-SOURCE.zip -d /tmp/questpad-src
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;35.0.0"
      - name: Test and build RC7
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/questpad-src
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Verify and zipalign RC7
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/questpad-src/app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/rc7-badging.txt
          grep -q "package: name='com.cornerofweird.questpad'" /tmp/rc7-badging.txt
          grep -q "versionCode='87'" /tmp/rc7-badging.txt
          grep -q "versionName='0.8.0-rc7'" /tmp/rc7-badging.txt
          grep -q "sdkVersion:'32'" /tmp/rc7-badging.txt
          grep -q "targetSdkVersion:'34'" /tmp/rc7-badging.txt
          unzip -l "$APK" > /tmp/rc7-files.txt
          ! grep -q "libquestpad_engine.so" /tmp/rc7-files.txt
          ! grep -q "questpad_vrshell_lease.dex" /tmp/rc7-files.txt
          ALIGNED=/tmp/QuestPad-v0.8.0-RC7-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$ALIGNED" | tee /tmp/rc7-zipalign.txt
          sha256sum "$ALIGNED" > /tmp/rc7-aligned-unsigned.sha256
          mkdir -p /tmp/android-sign-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/android-sign-tools/apksigner-35.0.0.jar
      - name: Upload RC7 unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: QuestPad-v0.8.0-RC7-unsigned
          path: |
            /tmp/QuestPad-v0.8.0-RC7-aligned-unsigned.apk
            /tmp/rc7-badging.txt
            /tmp/rc7-zipalign.txt
            /tmp/rc7-aligned-unsigned.sha256
            /tmp/android-sign-tools/apksigner-35.0.0.jar
